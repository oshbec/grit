[package]
name = "grit"
version = "0.1.0"
authors = ["Josh Bechard <josh@oshbec.dev>"]
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.19", features = ["v4", "serde"] }
sha1 = "0.10"
flate2 = "1.0"
hex = "0.4"
chrono = "0.4"

[[bin]]
name = "grit-cli"
path = "src/bin/cli.rs"

[features]
helper_tests = []
